name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root:
    name: root packaging checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: current
          check-latest: true
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            bridge/go.sum
            bridge/api-fit/go.sum

      - name: Toolchain versions
        run: |
          node --version
          go version

      - name: Test
        run: make test

      - name: Build hooks
        run: make build
