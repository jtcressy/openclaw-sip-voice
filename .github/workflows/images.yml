name: images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - Dockerfile.*
      - Makefile
      - packaging/**
      - plugin/**
      - bridge/**
      - protocol/**
      - .github/workflows/images.yml
      - .dockerignore
  pull_request:
    paths:
      - Dockerfile.*
      - Makefile
      - packaging/**
      - plugin/**
      - bridge/**
      - protocol/**
      - .github/workflows/images.yml
      - .dockerignore
  workflow_dispatch:
    inputs:
      push:
        description: Publish images to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plugin
            image: ghcr.io/jtcressy/openclaw-sip-voice-plugin
            dockerfile: Dockerfile.plugin
            target: artifact
            context: .
          - name: bridge
            image: ghcr.io/jtcressy/openclaw-sip-voice-bridge
            dockerfile: Dockerfile.bridge
            target: runtime
            context: .

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build image
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Record digest ref
        id: digest
        if: ${{ steps.build.outputs.digest != '' }}
        run: |
          digest_ref='${{ matrix.image }}@${{ steps.build.outputs.digest }}'
          echo "Digest ref:" >> "$GITHUB_STEP_SUMMARY"
          echo "$digest_ref" >> "$GITHUB_STEP_SUMMARY"
          echo "promotion_ref=$digest_ref" >> "$GITHUB_OUTPUT"
          mkdir -p image-digest-refs
          printf '%s\n' "$digest_ref" > "image-digest-refs/${{ matrix.name }}.txt"

      - name: Upload digest ref
        if: ${{ steps.build.outputs.digest != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-digest-ref-${{ matrix.name }}
          path: image-digest-refs/${{ matrix.name }}.txt
          if-no-files-found: error
